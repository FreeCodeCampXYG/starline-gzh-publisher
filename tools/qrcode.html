<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二维码工具 · QR Code</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    /* ================================================================
       Starline Design System — 二维码工具
       ================================================================ */
    :root {
      --bg: #0b1219;
      --surface: #151f2e;
      --surface-hover: #1c2a3d;
      --surface-active: #223249;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);
      --text-primary: #f0ede8;
      --text-secondary: rgba(240,237,232,0.55);
      --text-muted: rgba(240,237,232,0.3);
      --accent: #d4a855;
      --accent-soft: rgba(212,168,85,0.12);
      --accent-border: rgba(212,168,85,0.25);
      --success: #22c55e;
      --error: #ef4444;
      --radius: 10px;
      --radius-sm: 6px;
      --radius-full: 999px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 顶栏 ── */
    header {
      background: rgba(15,26,38,0.85);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .home-link {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      color: var(--text-secondary); text-decoration: none; flex: none;
      transition: all 0.2s;
    }
    .home-link:hover { background: var(--surface-hover); color: var(--text-primary); }
    .header-title {
      font-size: 13px; font-weight: 600; color: var(--text-primary);
      letter-spacing: 0.03em;
    }
    .header-title span { color: var(--text-muted); font-weight: 400; margin: 0 6px; }

    /* ── 主体双栏 ── */
    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      overflow: hidden;
      gap: 1px;
      background: var(--border);
    }
    @media (max-width: 720px) {
      .main { grid-template-columns: 1fr; }
    }
    .pane {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pane-header {
      padding: 12px 20px;
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      letter-spacing: 0.15em; text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ── 生成面板 ── */
    #gen-input {
      height: 100px;
      flex-shrink: 0;
      padding: 16px 20px;
      font-size: 13px;
      font-family: var(--font-mono);
      line-height: 1.7;
      color: var(--text-primary);
      border: none;
      outline: none;
      resize: none;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
    }
    #gen-input::placeholder { color: var(--text-muted); }
    #gen-input:focus { background: rgba(255,255,255,0.04); }

    .gen-qr-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px 20px;
    }
    .gen-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
    }
    .gen-hint svg { opacity: 0.3; }
    #gen-qr {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    #gen-qr img { display: block; }

    .gen-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
    }

    .gen-controls label {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .gen-controls select {
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }
    .gen-controls select:focus { border-color: var(--accent-border); }

    /* ── 解析面板 ── */
    .decode-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
      overflow-y: auto;
    }
    .decode-dropzone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px 20px;
      cursor: pointer;
      transition: all 0.25s;
      min-height: 200px;
      position: relative;
    }
    .decode-dropzone:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }
    .decode-dropzone.dragover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .decode-dropzone svg { opacity: 0.25; }
    .decode-dropzone-text {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }
    .decode-dropzone-text strong { color: var(--text-secondary); }
    #decode-file {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    #decode-preview {
      max-width: 200px;
      max-height: 200px;
      border-radius: var(--radius-sm);
      display: none;
    }
    #decode-result {
      padding: 12px 16px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-primary);
      word-break: break-all;
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    #decode-hint {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── 按钮 ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: var(--radius-full);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, #d4a855, #c4973f);
      color: #0b1219;
    }
    .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--surface-hover); color: var(--text-primary); }
    .btn-success {
      background: rgba(34,197,94,0.15);
      color: var(--success);
      border: 1px solid rgba(34,197,94,0.2);
    }
    .btn svg { flex-shrink: 0; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="home-link" title="返回首页">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </a>
    <div class="header-title">二维码 <span>·</span> QR Code</div>
  </header>

  <div class="main">

    <!-- 左：生成 -->
    <div class="pane">
      <div class="pane-header">生成二维码</div>
      <textarea id="gen-input" placeholder="输入文本或链接…" autofocus></textarea>
      <div class="gen-qr-area">
        <div class="gen-hint" id="gen-hint">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/>
            <rect x="19" y="14" width="2" height="2"/><rect x="14" y="19" width="2" height="2"/>
            <rect x="19" y="19" width="2" height="2"/>
          </svg>
          <span>输入内容后自动生成二维码</span>
        </div>
        <div id="gen-qr"></div>
      </div>
      <div class="gen-controls">
        <label>
          尺寸
          <select id="size-select">
            <option value="128">128</option>
            <option value="256" selected>256</option>
            <option value="384">384</option>
            <option value="512">512</option>
          </select>
        </label>
        <label>
          容错
          <select id="level-select">
            <option value="L">L (7%)</option>
            <option value="M" selected>M (15%)</option>
            <option value="Q">Q (25%)</option>
            <option value="H">H (30%)</option>
          </select>
        </label>
        <label>
          Logo
          <input type="file" id="logo-upload" accept="image/*" style="display:none">
          <input type="text" id="logo-input" placeholder="Logo URL" style="width:120px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-primary);font-size:11px;outline:none">
        </label>
        <button class="btn btn-secondary" id="download-btn" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          下载
        </button>
        <button class="btn btn-secondary" id="copy-btn" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          复制
        </button>
      </div>
    </div>

    <!-- 右：解析 -->
    <div class="pane">
      <div class="pane-header">解析二维码</div>
      <div class="decode-area">
        <div class="decode-dropzone" id="decode-dropzone">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <div class="decode-dropzone-text">
            <strong>拖放图片到此处</strong><br>
            或点击选择二维码图片
          </div>
          <input type="file" id="decode-file" accept="image/*">
          <img id="decode-preview" alt="二维码预览">
        </div>
        <div id="decode-result">等待解析…</div>
        <div id="decode-hint">支持 PNG、JPG、WebP 格式的二维码图片</div>
      </div>
    </div>

  </div>

  <script>
    // ── 生成 ──
    const genInput = document.getElementById('gen-input');
    const genQr = document.getElementById('gen-qr');
    const genHint = document.getElementById('gen-hint');
    const sizeSelect = document.getElementById('size-select');
    const levelSelect = document.getElementById('level-select');
    const logoInput = document.getElementById('logo-input');
    const logoUpload = document.getElementById('logo-upload');
    const downloadBtn = document.getElementById('download-btn');
    const copyBtn = document.getElementById('copy-btn');

    let qr = null;

    function generate() {
      const text = genInput.value.trim();
      if (!text) { genQr.innerHTML = ''; genHint.style.display = 'flex'; downloadBtn.style.display = 'none'; copyBtn.style.display = 'none'; return; }
      genHint.style.display = 'none';
      const size = parseInt(sizeSelect.value);
      const level = levelSelect.value;
      genQr.innerHTML = '';
      qr = new QRCode(genQr, { text, width: size, height: size, correctLevel: { L: 0, M: 1, Q: 2, H: 3 }[level] });
      downloadBtn.style.display = 'inline-flex';
      copyBtn.style.display = 'inline-flex';
      // re-apply logo
      const logo = logoInput.value.trim() || (logoUpload.files[0] ? URL.createObjectURL(logoUpload.files[0]) : '');
      if (logo) applyLogo(logo);
    }

    genInput.addEventListener('input', generate);
    sizeSelect.addEventListener('change', generate);
    levelSelect.addEventListener('change', generate);

    let currentLogo = '';
    function applyLogo(src) {
      currentLogo = src;
      const img = genQr.querySelector('img');
      if (!img) return;
      const canvas = document.createElement('canvas');
      const size = parseInt(sizeSelect.value);
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, size, size);
      const logoImg = new Image();
      logoImg.crossOrigin = 'anonymous';
      logoImg.onload = () => {
        const logoSize = size * 0.22;
        const lx = (size - logoSize) / 2, ly = (size - logoSize) / 2;
        // white bg
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(size / 2, size / 2, logoSize / 2 + 3, 0, Math.PI * 2); ctx.fill();
        ctx.drawImage(logoImg, lx, ly, logoSize, logoSize);
        genQr.innerHTML = '';
        genQr.appendChild(canvas);
      };
      logoImg.onerror = () => {};
      logoImg.src = src;
    }

    logoInput.addEventListener('input', () => { if (logoInput.value.trim()) applyLogo(logoInput.value.trim()); });
    logoUpload.addEventListener('change', () => {
      if (logoUpload.files[0]) { const url = URL.createObjectURL(logoUpload.files[0]); logoInput.value = url; applyLogo(url); }
    });

    // ── 下载 ──
    downloadBtn.addEventListener('click', () => {
      const img = genQr.querySelector('img') || genQr.querySelector('canvas');
      if (!img) return;
      const a = document.createElement('a');
      a.download = 'qrcode.png';
      if (img.tagName === 'CANVAS') { a.href = img.toDataURL(); } else { const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext('2d').drawImage(img, 0, 0); a.href = c.toDataURL(); }
      a.click();
    });

    // ── 复制图片 ──
    copyBtn.addEventListener('click', async () => {
      const img = genQr.querySelector('img') || genQr.querySelector('canvas');
      if (!img) return;
      try {
        let blob;
        if (img.tagName === 'CANVAS') { blob = await new Promise(r => img.toBlob(r, 'image/png')); }
        else { const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext('2d').drawImage(img, 0, 0); blob = await new Promise(r => c.toBlob(r, 'image/png')); }
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        copyBtn.textContent = '✓ 已复制';
        setTimeout(() => copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> 复制', 1500);
      } catch (_) { copyBtn.textContent = '✗ 复制失败'; setTimeout(() => copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> 复制', 1500); }
    });

    // ── 解析 ──
    const decodeFile = document.getElementById('decode-file');
    const decodePreview = document.getElementById('decode-preview');
    const decodeResult = document.getElementById('decode-result');
    const decodeHint = document.getElementById('decode-hint');
    const dropzone = document.getElementById('decode-dropzone');

    decodeFile.addEventListener('change', () => { if (decodeFile.files[0]) decodeQR(decodeFile.files[0]); });

    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); if (e.dataTransfer.files[0]) decodeQR(e.dataTransfer.files[0]); });

    async function decodeQR(file) {
      if (!file) return;
      decodeResult.textContent = '解析中…';
      const url = URL.createObjectURL(file);
      decodePreview.src = url;
      decodePreview.style.display = 'block';
      dropzone.querySelector('.decode-dropzone-text').style.display = 'none';
      try {
        const img = await new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = url; });
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        const code = jsQR(canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
        if (code) { decodeResult.textContent = code.data; decodeHint.textContent = '✓ 解析成功'; }
        else { decodeResult.textContent = '未识别到二维码'; decodeHint.textContent = '请尝试更清晰的图片'; }
      } catch (_) { decodeResult.textContent = '解析失败'; decodeHint.textContent = '图片格式不支持或已损坏'; }
    }
  </script>
</body>
</html>
