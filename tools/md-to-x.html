<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown → X 文章</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <script src="md-filter.js"></script>
  <script src="md-components.js"></script>
  <script src="md-themes.js"></script>
  <style>
    :root {
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --primary-light: #EFF6FF;
      --primary-soft: rgba(59,130,246,0.08);
      --accent: #F59E0B;
      --accent-dark: #D97706;
      --bg: #F8F9FA;
      --surface: #FFFFFF;
      --surface-hover: #F1F4F9;
      --border: #E2E8F0;
      --border-hover: #CBD5E1;
      --text-primary: #1E293B;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --success: #10B981;
      --error: #EF4444;
      --radius: 8px;
      --radius-sm: 6px;
      --radius-full: 999px;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Menlo', Consolas, monospace;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }

    .topbar { height: 52px; flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 12px; z-index: 100; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .home-link { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--radius-sm); color: var(--text-muted); text-decoration: none; transition: all 0.15s; }
    .home-link:hover { background: var(--surface-hover); color: var(--primary); }
    .brand-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), #1d4ed8); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 800; flex-shrink: 0; }
    .brand-copy { display: flex; flex-direction: column; flex-shrink: 0; }
    .brand-copy strong { font-size: 14px; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
    .brand-copy strong em { font-style: normal; color: var(--primary); }
    .brand-copy small { font-size: 9px; color: var(--text-muted); letter-spacing: 0.12em; font-weight: 600; text-transform: uppercase; }
    .brand-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
    .brand-tag { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .topbar-spacer { flex: 1; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .doc-title-wrap { display: none; align-items: center; gap: 6px; margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--border); min-width: 0; max-width: 280px; }
    .doc-title-text { font-size: 12px; color: var(--text-secondary); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .doc-title-copy { flex-shrink: 0; background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 2px; border-radius: 3px; display: flex; align-items: center; transition: color 0.15s; }
    .doc-title-copy:hover { color: var(--primary); }
    .topbar-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: all 0.15s; }
    .topbar-btn:hover { border-color: var(--border-hover); color: var(--text-primary); background: var(--surface-hover); }
    .topbar-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
    .btn-success { background: var(--success); border-color: var(--success); }
    @media (max-width: 700px) { .brand-tag, .brand-divider { display: none; } }

    .controlbar { height: 44px; flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 8px; overflow-x: auto; z-index: 99; }
    .controlbar::-webkit-scrollbar { height: 0; }
    .ctrl-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
    .ctrl-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .ctrl-label { font-size: 11px; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
    .ctrl-slider { display: flex; align-items: center; gap: 6px; }
    .ctrl-slider input[type=range] { width: 60px; accent-color: var(--primary); cursor: pointer; }
    .ctrl-slider b { font-size: 11px; color: var(--text-secondary); font-weight: 600; min-width: 28px; text-align: right; }
    .ctrl-select { padding: 4px 8px; font-size: 11px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-secondary); cursor: pointer; outline: none; font-family: var(--font-sans); }
    .ctrl-select:focus { border-color: var(--primary); }
    .ctrl-shortcut { display: flex; align-items: center; gap: 4px; padding: 4px 8px; font-size: 11px; border: none; border-radius: var(--radius-sm); background: none; color: var(--text-secondary); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .ctrl-shortcut:hover { background: var(--surface-hover); color: var(--text-primary); }
    .ctrl-shortcut svg { width: 14px; height: 14px; }
    .ctrl-shortcut.active { background: var(--primary-light); color: var(--primary); }
    .ctrl-toolbar-shortcuts { display: flex; align-items: center; gap: 2px; }
    .ctrl-color-group { display: flex; align-items: center; gap: 4px; }
    .bg-dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border); cursor: pointer; transition: all 0.15s; flex-shrink: 0; }
    .bg-dot:hover { transform: scale(1.15); }
    .bg-dot.active { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }

    .workspace { flex: 1; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; gap: 0; }
    @media (max-width: 800px) { .workspace { grid-template-columns: 1fr; } }

    .editor-pane { display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
    .pane-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .pane-head .eyebrow { font-size: 9px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; display: block; }
    .pane-head h2 { font-size: 14px; font-weight: 700; color: var(--text-primary); line-height: 1.2; margin-top: 1px; }
    .pane-actions { display: flex; gap: 6px; }
    .pane-actions button { padding: 5px 12px; font-size: 11px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: all 0.15s; }
    .pane-actions button:hover { border-color: var(--border-hover); color: var(--text-primary); background: var(--surface-hover); }

    #md-input { flex: 1; padding: 20px; font-size: 13px; font-family: var(--font-mono); line-height: 1.8; color: var(--text-primary); border: none; outline: none; resize: none; background: var(--surface); }
    #md-input::placeholder { color: var(--text-muted); }

    .diagnosis-panel { flex-shrink: 0; border-top: 1px solid var(--border); background: var(--surface); max-height: 30%; display: flex; flex-direction: column; }
    .diagnosis-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.05em; }
    .diagnosis-close { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px; border-radius: 4px; display: flex; }
    .diagnosis-close:hover { background: var(--surface-hover); color: var(--text-primary); }
    .diagnosis-list { overflow-y: auto; padding: 6px 8px; }
    .diagnosis-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.12s; font-size: 12px; }
    .diagnosis-item:hover { background: var(--surface-hover); }
    .diagnosis-item .d-sev { flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: var(--radius-full); margin-top: 1px; letter-spacing: 0.03em; }
    .diagnosis-item .d-sev.error { background: #fee2e2; color: var(--error); }
    .diagnosis-item .d-sev.warn { background: #fef3c7; color: #b45309; }
    .diagnosis-item .d-sev.info { background: #e0f2fe; color: #0369a1; }
    .diagnosis-item .d-body { flex: 1; min-width: 0; }
    .diagnosis-item .d-msg { color: var(--text-secondary); line-height: 1.4; }
    .diagnosis-item .d-line { color: var(--text-muted); font-family: var(--font-mono); font-size: 10px; flex-shrink: 0; margin-top: 2px; }
    .diagnosis-item .d-fix { color: var(--text-muted); font-size: 11px; line-height: 1.4; margin-top: 2px; word-break: break-all; }
    .diagnosis-item .d-fix b { color: var(--primary); font-weight: 600; }
    .diagnosis-summary { padding: 6px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted); }

    .statusbar { display: flex; align-items: center; gap: 16px; padding: 8px 20px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
    .statusbar .stat-num { font-weight: 700; color: var(--text-secondary); }

    .preview-pane { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    .preview-head { border-bottom: 1px solid var(--border); }
    .preview-head-actions { display: flex; gap: 6px; }
    .preview-head-actions button { display: flex; align-items: center; gap: 6px; padding: 5px 12px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: all 0.15s; }
    .preview-head-actions button:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .preview-head-actions button svg { width: 14px; height: 14px; }
    .preview-head-actions .copy-button { background: var(--primary); color: #fff; border-color: var(--primary); }
    .preview-head-actions .copy-button:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
    .preview-head-actions .copy-button.success { background: var(--success); border-color: var(--success); }

    .preview-scroll { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; justify-content: center; background: var(--bg); }
    .preview-stage { position: relative; max-width: 520px; width: 100%; }
    .phone-frame { background: var(--surface); border-radius: 18px; box-shadow: 0 8px 40px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }

    .x-meta { display: flex; align-items: center; gap: 10px; padding: 16px 20px 8px; }
    .x-meta .account-dot { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #000; color: #fff; font-size: 13px; font-weight: 900; }
    .x-meta .account-dot img { width: 100%; height: 100%; object-fit: cover; }
    .x-meta b { font-size: 14px; font-weight: 800; color: #000; display: block; }
    .x-meta b span { color: var(--text-muted); font-weight: 400; margin-left: 4px; }
    .x-meta small { font-size: 12px; color: var(--text-muted); }
    .x-head { padding: 10px 18px; }
    .x-title { font-size: 22px; font-weight: 800; line-height: 1.35; color: #000; margin-bottom: 6px; }
    .x-sub { font-size: 13px; color: var(--text-muted); }

    .x-content { padding: 8px 18px 16px; font-size: 15px; line-height: 1.75; color: #0f0f0f; }
    .x-content h2 { font-size: 20px; font-weight: 800; margin: 24px 0 10px; color: #0f0f0f; }
    .x-content h3 { font-size: 17px; font-weight: 700; margin: 18px 0 8px; color: #0f0f0f; }
    .x-content p { margin-bottom: 14px; }
    .x-content ul, .x-content ol { padding-left: 22px; margin-bottom: 14px; }
    .x-content li { margin-bottom: 6px; }
    .x-content strong { font-weight: 700; }
    .x-content em { font-style: italic; }
    .x-content a { color: var(--primary); text-decoration: none; }
    .x-content blockquote { border-left: 3px solid var(--border); padding-left: 14px; color: var(--text-secondary); margin-bottom: 14px; font-style: italic; }
    .x-content code { font-family: var(--font-mono); font-size: 12px; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; color: #0f172a; }
    .x-content pre { background: #0f172a; color: #e2e8f0; padding: 14px 16px; border-radius: var(--radius); overflow-x: auto; margin-bottom: 14px; font-size: 12px; line-height: 1.7; }
    .x-content pre code { background: none; color: inherit; padding: 0; font-size: inherit; }
    .x-content hr { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
    .x-content img { max-width: 100%; height: auto; border-radius: var(--radius); margin: 12px 0; width: 100%; }
    .x-content svg { max-width: 100%; height: auto; margin: 12px 0; }
    .x-content table { width: 100%; margin: 12px 0; border-collapse: collapse; font-size: 13px; }
    .x-content th { padding: 8px 10px; background: var(--primary-light); font-weight: 700; color: var(--text-primary); border: 1px solid var(--border); }
    .x-content td { padding: 7px 10px; color: var(--text-secondary); border: 1px solid var(--border); }

    .img-wrapper { position: relative; display: block; margin: 12px 0; }
    .img-wrapper img { border-radius: var(--radius); margin: 0; }
    .img-overlay-left { position: absolute; bottom: 0; left: 0; display: flex; align-items: stretch; max-width: 75%; border-radius: 0 4px 0 4px; overflow: hidden; }
    .img-alt-label { background: rgba(0,0,0,0.5); color: #fff; font-size: 11px; padding: 3px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .img-copy-alt-btn { background: rgba(0,0,0,0.6); color: #fff; border: none; border-left: 1px solid rgba(255,255,255,0.2); font-size: 11px; padding: 2px 8px; cursor: pointer; transition: background 0.15s; flex-shrink: 0; }
    .img-copy-alt-btn:hover { background: rgba(0,0,0,0.8); }
    .img-copy-b64-btn { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.5); color: #fff; border: none; border-radius: 4px; font-size: 11px; padding: 2px 8px; cursor: pointer; transition: background 0.15s; }
    .img-copy-b64-btn:hover { background: rgba(0,0,0,0.75); }
    .empty-hint { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 14px; gap: 8px; padding: 40px; text-align: center; }
    .empty-hint svg { width: 36px; height: 36px; opacity: 0.25; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <a href="index.html" class="home-link" title="返回 Starline 工具箱">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </a>
      <span class="brand-avatar">X</span>
      <div class="brand-copy">
        <strong><em>Starline</em> Writer</strong>
        <small>MARKDOWN → X</small>
      </div>
      <span class="brand-divider"></span>
      <span class="brand-tag">一份内容，三种平台。</span>
    </div>
    <div class="doc-title-wrap" id="doc-title-wrap">
      <span class="doc-title-text" id="doc-title-text"></span>
      <button class="doc-title-copy" id="doc-title-copy" title="复制标题" onclick="copyDocTitle()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      </button>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <button class="topbar-btn" onclick="loadDraft()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        重新加载
      </button>
      <button class="topbar-btn btn-primary" id="copy-btn" onclick="copyRichText()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        复制富文本
      </button>
    </div>
  </header>

  <div class="controlbar">
    <div class="ctrl-toolbar-shortcuts">
      <label class="ctrl-shortcut" onclick="toggleSync()" style="cursor:pointer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0115-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 01-15 6.7L3 16"/></svg>
        <span id="sync-label">同步</span>
      </label>
      <button class="ctrl-shortcut" id="diagnosis-btn" onclick="showDiagnosis()" style="display:none" title="格式诊断">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>诊断</span>
      </button>
      <label class="ctrl-shortcut" id="components-switch" onclick="toggleComponents()" style="cursor:pointer" title="杂志组件排版：封面卡/目录/章节编号/关键词标记/签名区">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span id="components-label">杂志排版</span>
      </label>
      <button class="ctrl-shortcut" id="signature-btn" onclick="openSignaturePanel()" title="设置文章署名与简介（缓存在本机）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <span>署名</span>
      </button>
    </div>
    <span class="ctrl-divider"></span>
    <div class="ctrl-group">
      <span class="ctrl-label">主题</span>
      <select class="ctrl-select" id="theme-select" onchange="changeXTheme(this.value)">
        <option value="graphite-minimal">石墨极简</option>
        <option value="moyu-green">摸鱼绿</option>
        <option value="tech-cobalt">科技钴蓝</option>
        <option value="red-white">红白</option>
        <option value="apple-open-course">苹果公开课</option>
        <option value="zen-whitespace">留白禅意</option>
        <option value="moyu-ticket">摸鱼票据</option>
        <option value="olive-journal">橄榄手记</option>
        <option value="klein-blue">克莱因蓝</option>
      </select>
    </div>
    <span class="ctrl-divider"></span>
    <div class="ctrl-group">
      <span class="ctrl-label">字号</span>
      <div class="ctrl-slider"><input id="ctrl-font-size" type="range" min="14" max="18" value="15" oninput="adjustFontSize(this.value)"><b id="ctrl-font-val">15px</b></div>
    </div>
    <span class="ctrl-divider"></span>
    <div class="ctrl-group" title="预览/文章背景色">
      <span class="ctrl-label">背景</span>
      <div class="ctrl-color-group">
        <button class="bg-dot active" style="background:#ffffff" onclick="setAppBg('#ffffff', this)" aria-label="白色"></button>
        <button class="bg-dot" style="background:#f3f4f6" onclick="setAppBg('#f3f4f6', this)" aria-label="浅灰"></button>
        <button class="bg-dot" style="background:#eef3f9" onclick="setAppBg('#eef3f9', this)" aria-label="淡蓝"></button>
        <button class="bg-dot" style="background:#0f172a" onclick="setAppBg('#0f172a', this)" aria-label="深色"></button>
      </div>
    </div>
  </div>

  <div class="workspace">
    <div class="editor-pane">
      <div class="pane-head">
        <div><span class="eyebrow">MARKDOWN / TXT</span><h2>原稿</h2></div>
        <div class="pane-actions">
          <button onclick="document.getElementById('md-file-input').click()">导入</button>
          <input type="file" id="md-file-input" accept=".md,.markdown,.txt,text/markdown,text/plain" style="display:none" onchange="importMdFile(event)">
          <button onclick="clearInput()">清空</button>
        </div>
      </div>
      <textarea id="md-input" placeholder="在此粘贴 Markdown 内容…"></textarea>
      <div class="diagnosis-panel" id="diagnosis-panel" style="display:none;">
        <div class="diagnosis-head">
          <span id="diagnosis-title">格式诊断</span>
          <button class="diagnosis-close" onclick="toggleDiagnosisPanel()" aria-label="关闭诊断">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="diagnosis-list" id="diagnosis-list"></div>
        <div class="diagnosis-summary" id="diagnosis-summary"></div>
      </div>
      <div class="statusbar">
        <span><span class="stat-num" id="stat-words">0</span> 字</span>
        <span>约 <span class="stat-num" id="stat-read-time">0</span> 分钟阅读</span>
      </div>
    </div>

    <div class="preview-pane">
      <div class="pane-head preview-head">
        <div><span class="eyebrow">X ARTICLE PREVIEW</span><h2>X 文章预览</h2></div>
        <div class="preview-head-actions">
          <button class="copy-button" id="copy-btn-2" onclick="copyRichText()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            <span>复制富文本</span>
          </button>
        </div>
      </div>
      <div class="preview-scroll" id="preview-scroll">
        <div class="preview-stage">
          <div class="phone-frame">
            <div class="x-meta">
              <span class="account-dot">X</span>
              <div>
                <b>Starline @starline_writer <small>·</small></b>
                <small>刚刚</small>
              </div>
            </div>
            <div id="preview">
              <div class="empty-hint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                <span>左侧粘贴 Markdown，这里实时预览</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById('md-input');
    const preview = document.getElementById('preview');
    marked.setOptions({ breaks: true });

    let docTitle = '';
    let lastFilterResult = null;

    // 组件排版模式（默认开启）
    let useComponents = true;
    try {
      const saved = localStorage.getItem('md2x-components');
      if (saved !== null) useComponents = saved !== '0';
    } catch (_) {}

    // X 平台默认石墨极简主题
    let currentThemeKey = 'graphite-minimal';
    try { currentThemeKey = localStorage.getItem('md2x-theme') || 'graphite-minimal'; } catch (_) {}

    function getSignature() {
      try {
        const raw = localStorage.getItem('md2x-signature');
        if (!raw) return null;
        const obj = JSON.parse(raw);
        return (obj && (obj.author || obj.bio)) ? obj : null;
      } catch (_) { return null; }
    }

    function toggleComponents() {
      useComponents = !useComponents;
      const lbl = document.getElementById('components-label');
      const sw = document.getElementById('components-switch');
      if (lbl) lbl.textContent = useComponents ? '杂志排版' : '简单排版';
      if (sw) sw.classList.toggle('active', useComponents);
      try { localStorage.setItem('md2x-components', useComponents ? '1' : '0'); } catch (_) {}
      render();
    }

    function openSignaturePanel() {
      let modal = document.getElementById('signature-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'signature-modal';
        modal.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,0.5);display:flex;align-items:center;justify-content:center;';
        modal.innerHTML = `<div style="background:#fff;border-radius:14px;padding:28px;width:420px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,0.2);">
          <h3 style="font-size:16px;font-weight:700;color:#111827;margin:0 0 6px;">文章署名设置</h3>
          <p style="font-size:12px;color:#6B7280;margin:0 0 18px;">填写后自动追加到文章末尾签名区，保存在本机浏览器。</p>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px;">署名</label>
          <input id="sig-author" type="text" placeholder="例如：Starline" style="width:100%;padding:9px 12px;border:1px solid #E5E7EB;border-radius:8px;font-size:13px;margin-bottom:14px;outline:none;box-sizing:border-box;" />
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px;">一句话简介</label>
          <input id="sig-bio" type="text" placeholder="例如：专注内容创作工具与效率方法论" style="width:100%;padding:9px 12px;border:1px solid #E5E7EB;border-radius:8px;font-size:13px;margin-bottom:20px;outline:none;box-sizing:border-box;" />
          <div style="display:flex;gap:10px;justify-content:flex-end;">
            <button onclick="closeSignaturePanel()" style="padding:8px 16px;border:1px solid #E5E7EB;border-radius:8px;background:#fff;color:#374151;font-size:13px;cursor:pointer;">取消</button>
            <button onclick="saveSignature()" style="padding:8px 16px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:13px;font-weight:600;cursor:pointer;">保存</button>
          </div>
        </div>`;
        document.body.appendChild(modal);
      }
      const sig = getSignature() || {};
      modal.querySelector('#sig-author').value = sig.author || '';
      modal.querySelector('#sig-bio').value = sig.bio || '';
      modal.style.display = 'flex';
    }
    function closeSignaturePanel() {
      const modal = document.getElementById('signature-modal');
      if (modal) modal.style.display = 'none';
    }
    function saveSignature() {
      const author = document.getElementById('sig-author').value.trim();
      const bio = document.getElementById('sig-bio').value.trim();
      try {
        if (author || bio) localStorage.setItem('md2x-signature', JSON.stringify({ author, bio }));
        else localStorage.removeItem('md2x-signature');
      } catch (_) {}
      closeSignaturePanel();
      showToast('署名已保存，重新渲染预览', 'success');
      render();
    }
    window.closeSignaturePanel = closeSignaturePanel;
    window.saveSignature = saveSignature;

    function changeXTheme(id) {
      currentThemeKey = id;
      try { localStorage.setItem('md2x-theme', id); } catch (_) {}
      render();
    }

    function extractTitle(md) {
      const m = md.match(/^# (.+)$/m);
      return m ? m[1].trim() : '';
    }
    function updateTitleDisplay(title) {
      docTitle = title;
      const wrap = document.getElementById('doc-title-wrap');
      const text = document.getElementById('doc-title-text');
      text.textContent = title;
      wrap.style.display = title ? 'flex' : 'none';
    }
    async function copyDocTitle() {
      if (!docTitle) return;
      const btn = document.getElementById('doc-title-copy');
      await navigator.clipboard.writeText(docTitle);
      btn.style.color = '#16a34a';
      setTimeout(() => btn.style.color = '', 1500);
    }

    function toBase64(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
          canvas.getContext('2d').drawImage(img, 0, 0);
          resolve(canvas.toDataURL());
        };
        img.onerror = reject; img.src = src;
      });
    }
    async function inlineImages() {
      const imgs = preview.querySelectorAll('img');
      await Promise.all(Array.from(imgs).map(async (img) => {
        if (img.src.startsWith('data:')) return;
        try { img.src = await toBase64(img.src); } catch (_) { }
      }));
    }
    function decorateImages() {
      preview.querySelectorAll('img:not([data-decorated])').forEach(img => {
        img.setAttribute('data-decorated', '1');
        const alt = img.getAttribute('alt') || '';
        const wrapper = document.createElement('div');
        wrapper.className = 'img-wrapper';
        img.parentNode.insertBefore(wrapper, img);
        wrapper.appendChild(img);
        if (alt) {
          const overlay = document.createElement('div');
          overlay.className = 'img-overlay-left';
          const label = document.createElement('div'); label.className = 'img-alt-label'; label.textContent = alt;
          const copyBtn = document.createElement('button'); copyBtn.className = 'img-copy-alt-btn'; copyBtn.textContent = '复制';
          copyBtn.onclick = async () => { await navigator.clipboard.writeText(alt); copyBtn.textContent = '✓'; setTimeout(() => copyBtn.textContent = '复制', 1500); };
          overlay.appendChild(label); overlay.appendChild(copyBtn);
          wrapper.appendChild(overlay);
        }
        const copyImgBtn = document.createElement('button');
        copyImgBtn.className = 'img-copy-b64-btn'; copyImgBtn.textContent = '复制图片';
        copyImgBtn.onclick = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
          canvas.getContext('2d').drawImage(img, 0, 0);
          canvas.toBlob(async (blob) => {
            try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); copyImgBtn.textContent = '✓'; }
            catch (_) { copyImgBtn.textContent = '✗'; }
            setTimeout(() => copyImgBtn.textContent = '复制图片', 1500);
          }, 'image/png');
        };
        wrapper.appendChild(copyImgBtn);
      });
    }

    // X 文章渲染（保留 H1 作为文章标题，不删除）
    async function render() {
      const rawMd = input.value.trim();
      if (!rawMd) {
        updateTitleDisplay('');
        preview.innerHTML = `<div class="empty-hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <span>左侧粘贴 Markdown，这里实时预览</span>
        </div>`;
        updateStats(0, 0);
        updateDiagnosisBtn(null);
        return;
      }
      const filterResult = MdFilter.process(rawMd, { convertSVG: false });
      lastFilterResult = filterResult;
      const md = filterResult.md;
      updateTitleDisplay(extractTitle(rawMd));

      // ── 组件排版模式（默认开启）──
      if (useComponents && typeof MdComponents !== 'undefined') {
        const theme = (typeof MdThemes !== 'undefined') ? MdThemes.get(currentThemeKey) : MdThemes.get('graphite-minimal');
        const sig = getSignature();
        const comp = MdComponents.render(md, theme, {
          cover: true,
          toc: true,
          underline: true,
          signature: sig,
          date: new Date().getFullYear() + '.' + String(new Date().getMonth() + 1).padStart(2, '0'),
          brand: (sig && sig.author) ? sig.author : 'Starline Writer',
          subtitle: (sig && sig.bio) ? sig.bio : '一份内容，多种输出。',
          topLabel: 'STARLINE · 原创',
          tag1: '原创',
          tag2: '深度',
        });
        preview.innerHTML = `<div class="x-content">${comp.html}</div>`;
        const charCount = rawMd.replace(/\s/g, '').length;
        const readTime = Math.max(1, Math.round(charCount / 400));
        updateStats(charCount, readTime);
        updateDiagnosisBtn(filterResult);
        await inlineImages();
        decorateImages();
        return;
      }

      let html = marked.parse(md);
      html = MdFilter.injectSVG(html, filterResult.svgBlocks);
      // 包裹在 x-content 容器中，X 风格
      preview.innerHTML = `<div class="x-content">${html}</div>`;
      const charCount = rawMd.replace(/\s/g, '').length;
      const readTime = Math.max(1, Math.round(charCount / 400));
      updateStats(charCount, readTime);
      updateDiagnosisBtn(filterResult);
      await inlineImages();
      decorateImages();
    }
    input.addEventListener('input', render);

    function updateStats(words, readTime) {
      document.getElementById('stat-words').textContent = words;
      document.getElementById('stat-read-time').textContent = readTime || 1;
    }
    function updateDiagnosisBtn(filterResult) {
      const btn = document.getElementById('diagnosis-btn');
      if (!filterResult || !filterResult.hasIssue) { btn.style.display = 'none'; return; }
      btn.style.display = 'inline-flex';
      const hasError = filterResult.report.some(r => r.severity === 'error');
      btn.className = 'ctrl-shortcut' + (hasError ? ' has-error' : ' has-issue');
      btn.querySelector('span').textContent = `诊断 (${filterResult.report.length})`;
      const panel = document.getElementById('diagnosis-panel');
      if (panel.style.display !== 'none') renderDiagnosisPanel(filterResult);
    }
    const sevLabel = { error: '错误', warn: '警告', info: '提示' };
    function showDiagnosis() {
      if (!lastFilterResult || !lastFilterResult.report.length) { showToast('未检测到格式问题', 'success'); return; }
      renderDiagnosisPanel(lastFilterResult);
      document.getElementById('diagnosis-panel').style.display = 'flex';
    }
    function renderDiagnosisPanel(filterResult) {
      const report = filterResult.report || [];
      document.getElementById('diagnosis-list').innerHTML = report.map((r, idx) =>
        `<div class="diagnosis-item" onclick="jumpToLine(${r.line || 1}, ${idx})">
          <span class="d-sev ${r.severity}">${sevLabel[r.severity] || r.severity}</span>
          <span class="d-body">
            <div class="d-msg">${escapeHtml(r.message)}</div>
            ${r.fix ? `<div class="d-fix">建议：<b>${escapeHtml(r.fix)}</b></div>` : ''}
          </span>
          <span class="d-line">${r.line ? 'L' + r.line : ''}</span>
        </div>`
      ).join('') || '<div style="padding:8px;color:var(--success);font-size:12px;">✓ 未检测到格式问题</div>';
      const errs = report.filter(r => r.severity === 'error').length;
      const warns = report.filter(r => r.severity === 'warn').length;
      document.getElementById('diagnosis-summary').textContent = `共 ${report.length} 项 · 错误 ${errs} · 警告 ${warns}（点击条目定位到原稿对应行）`;
      document.getElementById('diagnosis-title').textContent = `格式诊断（${report.length} 个问题）`;
    }
    function toggleDiagnosisPanel() {
      const panel = document.getElementById('diagnosis-panel');
      panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
      if (panel.style.display !== 'none' && lastFilterResult) renderDiagnosisPanel(lastFilterResult);
    }
    function jumpToLine(line, reportIdx) {
      if (!line) return;
      const lines = input.value.split('\n');
      let offset = 0;
      for (let i = 0; i < line - 1; i++) offset += (lines[i] || '').length + 1;
      const lineHeight = parseFloat(getComputedStyle(input).lineHeight) || 20;
      input.focus();
      try { input.setSelectionRange(offset, offset); } catch (_) {}
      input.scrollTop = Math.max(0, (line - 1) * lineHeight - input.clientHeight * 0.3);
      document.querySelectorAll('#diagnosis-list .diagnosis-item').forEach((el, i) => {
        el.style.background = (i === reportIdx) ? 'var(--primary-light)' : '';
      });
    }

    // 复制富文本：克隆预览内容，剔除 UI 元素
    function buildXHTML() {
      const content = preview.querySelector('.x-content');
      if (!content) return '';
      const clone = content.cloneNode(true);
      clone.querySelectorAll('.img-overlay-left, .img-copy-b64-btn').forEach(el => el.remove());
      clone.querySelectorAll('.img-wrapper').forEach(w => {
        const img = w.querySelector('img');
        if (img) w.replaceWith(img);
      });
      clone.querySelectorAll('[data-decorated]').forEach(el => el.removeAttribute('data-decorated'));
      return `<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;font-size:15px;line-height:1.75;color:#0f0f0f;max-width:500px;margin:0 auto;">${clone.innerHTML}</div>`;
    }
    function copyRichText() {
      const md = input.value.trim();
      if (!md) { showToast('请先粘贴 Markdown 内容', 'info'); return; }
      const html = buildXHTML();
      const btn = document.getElementById('copy-btn');
      const btn2 = document.getElementById('copy-btn-2');
      navigator.clipboard.write([
        new ClipboardItem({
          'text/html': new Blob([html], { type: 'text/html' }),
          'text/plain': new Blob([md], { type: 'text/plain' }),
        })
      ]).then(() => {
        [btn, btn2].forEach(b => {
          if (!b) return;
          b.classList.add('btn-success');
          const orig = b.innerHTML;
          b.innerHTML = '✓ 已复制';
          setTimeout(() => { b.innerHTML = orig; b.classList.remove('btn-success'); }, 3000);
        });
      }).catch(() => {
        navigator.clipboard.writeText(md);
        showToast('富文本复制不支持，已复制纯文本', 'info');
      });
    }

    function showToast(title, type, description) {
      let vp = document.getElementById('toast-viewport');
      if (!vp) {
        vp = document.createElement('div');
        vp.id = 'toast-viewport';
        vp.style.cssText = 'position:fixed;bottom:22px;right:22px;z-index:10000;display:flex;flex-direction:column;gap:10px;';
        document.body.appendChild(vp);
      }
      const el = document.createElement('div');
      el.style.cssText = 'pointer-events:auto;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:12px 14px;font-size:13px;color:var(--text-primary);';
      el.style.color = type === 'error' ? 'var(--error)' : type === 'success' ? 'var(--success)' : 'var(--text-primary)';
      const t = document.createElement('span'); t.textContent = title;
      el.appendChild(t);
      const close = document.createElement('button');
      close.textContent = '×'; close.style.cssText = 'border:none;background:none;cursor:pointer;color:var(--text-muted);font-size:16px;';
      close.onclick = () => el.remove();
      el.appendChild(close);
      vp.appendChild(el);
      setTimeout(() => el.remove(), 4200);
    }

    function adjustFontSize(val) {
      document.getElementById('ctrl-font-val').textContent = val + 'px';
      const body = preview.querySelector('.x-content');
      if (body) body.style.fontSize = val + 'px';
    }
    function luminance(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const r = parseInt(c.substring(0, 2), 16) / 255, g = parseInt(c.substring(2, 4), 16) / 255, b = parseInt(c.substring(4, 6), 16) / 255;
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }
    function setAppBg(color, btnEl) {
      document.querySelectorAll('.bg-dot').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      const body = preview.querySelector('.x-content');
      const stage = document.getElementById('preview-scroll');
      if (body) {
        body.style.backgroundColor = color;
        const isDark = luminance(color) < 0.4;
        body.style.color = isDark ? '#f3f4f6' : '#0f0f0f';
        body.querySelectorAll('p, li, h2, h3, td').forEach(el => {
          if (el.tagName !== 'CODE') el.style.color = isDark ? '#f3f4f6' : '';
        });
      }
      if (stage) stage.style.background = color;
    }

    function clearInput() { input.value = ''; render(); }
    function importMdFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => { input.value = ev.target.result; render(); };
      reader.readAsText(file);
      e.target.value = '';
    }
    function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    async function loadDraft() {
      try {
        const res = await fetch('./draft.md');
        if (!res.ok) return;
        const text = await res.text();
        const jsonM = text.match(/```json\s*([\s\S]*?)```/);
        if (jsonM) {
          try {
            const parsed = JSON.parse('{' + jsonM[1].trim().replace(/,$/, '') + '}');
            updateTitleDisplay(parsed.changes?.content?.title || '');
          } catch (_) {}
        }
        const m = text.match(/^## 正文\s*\n([\s\S]*)/m);
        const body = m ? m[1].replace(/\n---\n\*运行[\s\S]*$/, '').trimEnd() : text.trimEnd();
        input.value = body;
      } catch (_) {}
      await render();
    }
    loadDraft();
    // 同步组件开关 + 主题下拉 UI 状态
    (function () {
      const sw = document.getElementById('components-switch');
      const lbl = document.getElementById('components-label');
      if (sw) sw.classList.toggle('active', useComponents);
      if (lbl) lbl.textContent = useComponents ? '杂志排版' : '简单排版';
      const sel = document.getElementById('theme-select');
      if (sel) sel.value = currentThemeKey;
    })();

    let syncScroll = true;
    function toggleSync() {
      syncScroll = !syncScroll;
      document.getElementById('sync-label').textContent = syncScroll ? '同步' : '不同步';
    }
    input.addEventListener('scroll', () => {
      if (!syncScroll) return;
      const pct = input.scrollTop / (input.scrollHeight - input.clientHeight) || 0;
      preview.scrollTop = pct * (preview.scrollHeight - preview.clientHeight);
    });
    preview.addEventListener('scroll', () => {
      if (!syncScroll) return;
      const pct = preview.scrollTop / (preview.scrollHeight - preview.clientHeight) || 0;
      input.scrollTop = pct * (input.scrollHeight - input.clientHeight);
    });
  </script>
</body>
</html>
